id: http
name: HTTP
version: 1.0.8
icon:
  media_type: image/png
  data_base64: 
  color_pair:
    primary: "#3266B8"
    secondary: "#58B5E8"
source:
  kind: built_in
  package: null
runtime:
  kind: wasm_component
  component_ref: component/http.wasm
  abi: firna-app-component-v1
install:
  policy: workspace_default
capabilities:
  http:
    allow_any_host: true
tools:
- name: http_request
  description: Send an HTTP request to an external API and inspect the response.
  activity_label: Sending HTTP request
  auth: []
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: http.request
  allowed_agent_roles: []
  required_agent_permissions:
    workspace_root: false
    manage_secrets: false
  side_effect: external_write
  limits:
    max_response_bytes: null
    max_component_ms: null
  input_schema:
    type: object
    required:
    - url
    properties:
      method:
        type: string
        enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      url:
        type: string
      query:
        type: object
        additionalProperties:
          type: string
      headers:
        type: object
        additionalProperties:
          type: string
      body_json: {}
      body_text:
        type: string
      timeout_seconds:
        type: integer
        minimum: 1
        maximum: 300
ingress: []
events: []
limits: {}
