id: github
name: GitHub
version: 2.0.0
icon:
  media_type: image/png
  data_base64: 
  color_pair:
    primary: "#24292F"
    secondary: "#2F81F7"
source:
  kind: built_in
  package: null
runtime:
  kind: wasm_component
  component_ref: component/github.wasm
  abi: firna-app-component-v1
secrets:
- name: client_secret
  required: true
- name: private_key
  required: true
install:
  policy: explicit
capabilities:
  http:
    allowed_hosts:
    - api.github.com
    allowed_methods:
    - GET
    max_response_bytes: 1048576
limits:
  max_tool_response_bytes: 1048576
auth_requirements:
- id: github_installation
  display_name: GitHub repositories
  description: Connect a GitHub App installation so your workspace can read only the repositories you select.
  management_url: https://github.com/settings/installations
  kind: app_installation
  provider: github
  credential_flow: github
  owner: workspace
  scopes:
  - contents:read
  - issues:read
  - metadata:read
  - pull_requests:read
  credential_kinds:
  - provider_installation_id
  required_for:
  - tool:github_list_repositories
  - tool:github_search_code
  - tool:github_read_file
  - tool:github_read_pr
  - tool:github_read_issue
credential_flows:
- id: github
  kind: installation_token
  provider: github
  client_id: replace-with-registered-github-app-client-id
  app_slug: firna
  client_secret_env: client_secret
  private_key_env: private_key
  setup_url: https://firna.ai/apps/github/install/callback
  callback_url: https://firna.ai/apps/github/authorize/callback
  installation_id_credential_kind: provider_installation_id
  token_credential_kind: installation_token
  permissions:
    metadata: read
    contents: read
    issues: read
    pull_requests: read
tools:
- name: github_list_repositories
  description: List repositories selected for the connected GitHub App installation.
  activity_verb: Listing
  auth: [github_installation]
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: github.list_repositories
  allowed_agent_roles: []
  required_agent_permissions:
    workspace_root: false
    manage_secrets: false
  side_effect: external_read
  limits:
    max_response_bytes: 1048576
    max_component_ms: null
  input_schema:
    type: object
    additionalProperties: false
    properties:
      page:
        type: integer
        minimum: 1
        maximum: 2147483647
      per_page:
        type: integer
        minimum: 1
        maximum: 50
- name: github_search_code
  description: Search code in repositories selected for this workspace.
  activity_verb: Searching
  auth: [github_installation]
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: github.search_code
  allowed_agent_roles: []
  required_agent_permissions:
    workspace_root: false
    manage_secrets: false
  side_effect: external_read
  limits:
    max_response_bytes: 1048576
    max_component_ms: null
  input_schema:
    type: object
    additionalProperties: false
    required: [query]
    properties:
      query:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '\S'
      owner:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9]([A-Za-z0-9-]{0,98}[A-Za-z0-9])?$'
      repository:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9._-]+$'
        not:
          enum: ['.', '..']
      language:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '\S'
      path:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[^\u0000-\u001F\u007F]*$'
      page:
        type: integer
        minimum: 1
        maximum: 2147483647
      per_page:
        type: integer
        minimum: 1
        maximum: 20
- name: github_read_file
  description: Read one exact regular UTF-8 file with at most 16 path segments from a GitHub repository.
  activity_verb: Reading
  auth: [github_installation]
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: github.read_file
  allowed_agent_roles: []
  required_agent_permissions:
    workspace_root: false
    manage_secrets: false
  side_effect: external_read
  limits:
    max_response_bytes: 1048576
    max_component_ms: null
  input_schema:
    type: object
    additionalProperties: false
    required: [owner, repository, path]
    properties:
      owner:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9]([A-Za-z0-9-]{0,98}[A-Za-z0-9])?$'
      repository:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9._-]+$'
        not:
          enum: ['.', '..']
      path:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: '^[^/\u0000-\u001F\u007F]+(/[^/\u0000-\u001F\u007F]+)*$'
        not:
          pattern: '(^|/)\.{1,2}($|/)'
      ref:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[^\u0000-\u001F\u007F]*$'
- name: github_read_pr
  description: Read a pull request and one bounded page of changed files.
  activity_verb: Reading
  auth: [github_installation]
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: github.read_pr
  allowed_agent_roles: []
  required_agent_permissions:
    workspace_root: false
    manage_secrets: false
  side_effect: external_read
  limits:
    max_response_bytes: 1048576
    max_component_ms: null
  input_schema:
    type: object
    additionalProperties: false
    required: [owner, repository, number]
    properties:
      owner:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9]([A-Za-z0-9-]{0,98}[A-Za-z0-9])?$'
      repository:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9._-]+$'
        not:
          enum: ['.', '..']
      number:
        type: integer
        minimum: 1
        maximum: 2147483647
      include_files:
        type: boolean
      files_page:
        type: integer
        minimum: 1
        maximum: 2147483647
      files_per_page:
        type: integer
        minimum: 1
        maximum: 10
- name: github_read_issue
  description: Read an issue and one bounded page of comments.
  activity_verb: Reading
  auth: [github_installation]
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: github.read_issue
  allowed_agent_roles: []
  required_agent_permissions:
    workspace_root: false
    manage_secrets: false
  side_effect: external_read
  limits:
    max_response_bytes: 1048576
    max_component_ms: null
  input_schema:
    type: object
    additionalProperties: false
    required: [owner, repository, number]
    properties:
      owner:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9]([A-Za-z0-9-]{0,98}[A-Za-z0-9])?$'
      repository:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9._-]+$'
        not:
          enum: ['.', '..']
      number:
        type: integer
        minimum: 1
        maximum: 2147483647
      include_comments:
        type: boolean
      comments_page:
        type: integer
        minimum: 1
        maximum: 2147483647
      comments_per_page:
        type: integer
        minimum: 1
        maximum: 10
ingress: []
event_subscriptions: []
handler_roles: []
