[package]
name = "fna-app-github-component"
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["Polybase"]

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
http = "1.4.2"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
wit-bindgen = "0.59.0"

[dev-dependencies]
unimock = "0.6.8"
