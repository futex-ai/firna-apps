[package]
name = "fna-app-dataforseo-platform-runtime-tests"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Polybase"]

[workspace]

[dependencies]
fna-apps-interface = { git = "https://github.com/futex-ai/firna.git", rev = "5a7060b5d369190a6b102dfb07af0a300dd4502f" }
fna-apps-wasm = { git = "https://github.com/futex-ai/firna.git", rev = "5a7060b5d369190a6b102dfb07af0a300dd4502f" }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
unimock = "0.6.8"
uuid = { version = "1.24.0", features = ["v7"] }

[dev-dependencies]
jsonschema = { version = "0.48.1", default-features = false }
