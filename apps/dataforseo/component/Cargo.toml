[package]
name = "fna-app-dataforseo-component"
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Polybase"]

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.45", features = ["alloc", "serde"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
url = "2.5.8"
wit-bindgen = "0.59.0"

[dev-dependencies]
unimock = "0.6.8"
