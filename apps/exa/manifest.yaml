id: exa
name: Exa
version: 1.0.18
icon:
  media_type: image/png
  data_base64: 
  color_pair:
    primary: "#111111"
    secondary: "#8B5CF6"
source:
  kind: built_in
  package: null
runtime:
  kind: wasm_component
  component_ref: component/exa.wasm
  abi: firna-app-component-v1
secrets:
- name: api_key
  required: true
install:
  policy: workspace_default
capabilities:
  http:
    allowed_hosts:
    - api.exa.ai
    credential_headers:
    - x-api-key
auth_requirements:
- id: exa-api-key
  kind: api_key
  credential_flow: exa-api-key
  owner: workspace
  scopes: []
  credential_kinds:
  - api_key
credential_flows:
- id: exa-api-key
  kind: api_key
  field:
    credential_kind: api_key
    label: Exa API key
    input_mode: password
    max_bytes: 256
  help_url: https://dashboard.exa.ai/api-keys
tools:
- name: exa_web_search
  description: Search the live web through Exa and return compact cited results.
  activity_label: Searching the web
  auth: []
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: exa.search
  allowed_agent_roles: []
  side_effect: external_read
  limits:
    max_response_bytes: null
    max_component_ms: null
  input_schema:
    type: object
    required:
    - query
    properties:
      query:
        type: string
      search_type:
        type: string
        enum:
        - auto
        - fast
        - instant
        - deep-lite
        - deep
        - deep-reasoning
      num_results:
        type: integer
        minimum: 1
        maximum: 100
      category:
        type: string
        enum:
        - company
        - people
        - research paper
        - news
        - personal site
        - financial report
      include_domains:
        type: array
        items:
          type: string
      exclude_domains:
        type: array
        items:
          type: string
      start_published_date:
        type: string
      end_published_date:
        type: string
      livecrawl:
        type: boolean
      highlights_max_characters:
        type: integer
        minimum: 1
        maximum: 20000
      text_max_characters:
        type: integer
        minimum: 1
        maximum: 20000
      timeout_seconds:
        type: integer
        minimum: 1
        maximum: 300
ingress: []
limits: {}
