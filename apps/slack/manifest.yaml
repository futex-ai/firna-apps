id: slack
name: Slack
version: 1.1.26
icon:
  media_type: image/png
  data_base64: 
  color_pair:
    primary: "#36C5F0"
    secondary: "#E01E5A"
source:
  kind: community
  package: null
runtime:
  kind: wasm_component
  component_ref: component/slack.wasm
  abi: firna-app-component-v1
env:
  client_id: "11091195509639.11091214763735"
secrets:
- name: client_secret
  required: true
- name: signing_secret
  required: true
install:
  policy: explicit
capabilities:
  http:
    allowed_hosts:
    - slack.com
    - api.slack.com
  crypto:
    hmac: true
  storage: app_scoped
auth_requirements:
- id: slack_bot
  kind: oauth_install
  provider: slack
  credential_flow: slack
  owner: workspace
  scopes:
  - app_mentions:read
  - channels:history
  - channels:read
  - chat:write
  - groups:history
  - groups:read
  - im:history
  - im:read
  - mpim:history
  - mpim:read
  credential_kinds:
  - bot_token
  required_for: []
- id: slack_user_search
  kind: oauth_grant
  provider: slack
  credential_flow: slack
  owner: user
  scopes:
  - search:read
  credential_kinds:
  - user_token
  required_for:
  - tool:slack_search_messages
credential_flows:
- kind: standard_oauth2
  id: slack
  authorization_url: https://slack.com/oauth/v2/authorize
  token_url: https://slack.com/api/oauth.v2.access
  client:
    client_id: null
    client_id_env: client_id
    client_secret_env: client_secret
    auth_method: client_secret_post
  scope:
    separator: ','
    authorization_param: scope
    user_authorization_param: user_scope
    token_param: null
  authorization_params: {}
  token_params: {}
  pkce:
    mode: required_for_public_clients
    method: S256
  response_mapping:
    provider_account_id:
    - $.team.id
    - $.enterprise.id
    provider_user_id: null
    granted_scopes: null
    credentials: []
    requirements:
    - auth_requirement_id: slack_bot
      provider_account_id: null
      provider_user_id: null
      granted_scopes: $.scope
      credentials:
      - auth_requirement_id: null
        credential_kind: bot_token
        value: $.access_token
    - auth_requirement_id: slack_user_search
      provider_account_id: null
      provider_user_id: $.authed_user.id
      granted_scopes: $.authed_user.scope
      credentials:
      - auth_requirement_id: null
        credential_kind: user_token
        value: $.authed_user.access_token
tools:
- name: slack_list_channels
  description: List Slack channels visible to the workspace app bot.
  activity_label: Listing Slack channels
  auth:
  - slack_bot
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: slack.list_channels
  allowed_agent_roles: []
  side_effect: external_read
  limits:
    max_response_bytes: null
    max_component_ms: null
  input_schema:
    properties:
      cursor:
        type: string
      exclude_archived:
        type: boolean
      limit:
        maximum: 200
        minimum: 1
        type: integer
      types:
        type: string
    type: object
- name: slack_read_channel_history
  description: Read recent Slack channel messages visible to the app bot.
  activity_label: Reading Slack channel history
  auth:
  - slack_bot
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: slack.read_channel_history
  allowed_agent_roles: []
  side_effect: external_read
  limits:
    max_response_bytes: null
    max_component_ms: null
  input_schema:
    properties:
      channel_id:
        type: string
      cursor:
        type: string
      latest:
        type: string
      limit:
        maximum: 200
        minimum: 1
        type: integer
      oldest:
        type: string
    required:
    - channel_id
    type: object
- name: slack_send_message
  description: Send a Slack message as the workspace app bot.
  activity_label: Sending Slack message
  icon:
    media_type: image/png
    data_base64: 
  auth:
  - slack_bot
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: slack.send_message
  allowed_agent_roles: []
  side_effect: external_write
  limits:
    max_response_bytes: null
    max_component_ms: null
  input_schema:
    properties:
      channel_id:
        type: string
      text:
        type: string
      thread_ts:
        type: string
    required:
    - channel_id
    - text
    type: object
- name: slack_search_messages
  description: Search Slack messages using a user-authorized Slack grant.
  activity_label: Searching Slack messages
  icon:
    media_type: image/png
    data_base64: 
  auth:
  - slack_bot
  - slack_user_search
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: slack.search_messages
  allowed_agent_roles: []
  side_effect: external_read
  limits:
    max_response_bytes: null
    max_component_ms: null
  input_schema:
    properties:
      cursor:
        type: string
      limit:
        maximum: 100
        minimum: 1
        type: integer
      query:
        type: string
      sort:
        type: string
      sort_dir:
        type: string
    required:
    - query
    type: object
ingress:
- id: slack_events
  kind: webhook
  provider: slack
  allowed_headers:
  - x-slack-request-timestamp
  - x-slack-signature
  auth:
  - slack_bot
  verify_export: verify-webhook
  normalize_export: normalize-event
  response_export: webhook-response
  credential_kinds:
  - signing_secret
  max_payload_bytes: 262144
  events:
  - id: app_mention
    provider_type: app_mention
    description: A Slack message mentions the workspace app bot.
    contract_version: 1
  - id: message_channels
    provider_type: message.channels
    description: A public channel message is visible to the workspace app bot.
    contract_version: 1
  - id: message_groups
    provider_type: message.groups
    description: A private channel message is visible to the workspace app bot.
    contract_version: 1
  - id: message_im
    provider_type: message.im
    description: A direct message is visible to the workspace app bot.
    contract_version: 1
  - id: message_mpim
    provider_type: message.mpim
    description: A group direct message is visible to the workspace app bot.
    contract_version: 1
limits:
  max_event_payload_bytes: 262144
  max_tool_response_bytes: 1048576
  max_component_ms: 5000
