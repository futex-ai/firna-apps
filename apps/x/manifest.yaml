id: x
name: X
version: 1.0.5
icon:
  media_type: image/png
  data_base64: 
  color_pair:
    primary: "#000000"
    secondary: "#FFFFFF"
source:
  kind: built_in
  package: null
runtime:
  kind: wasm_component
  component_ref: component/x.wasm
  abi: firna-app-component-v1
env: {}
secrets:
- name: client_id
  required: true
- name: client_secret
  required: true
install:
  policy: explicit
capabilities:
  http:
    allowed_hosts:
    - api.x.com
auth_requirements:
- id: x_workspace
  kind: oauth_install
  provider: x
  credential_flow: x_oauth
  owner: workspace
  scopes:
  - tweet.read
  - tweet.write
  - users.read
  - offline.access
  credential_kinds:
  - access_token
  - refresh_token
  required_for: []
credential_flows:
- kind: standard_oauth2
  id: x_oauth
  authorization_url: https://x.com/i/oauth2/authorize
  token_url: https://api.x.com/2/oauth2/token
  client:
    client_id: null
    client_id_env: client_id
    client_secret_env: client_secret
    auth_method: client_secret_basic
  scope:
    separator: ' '
    authorization_param: scope
    user_authorization_param: null
    token_param: null
  authorization_params: {}
  token_params: {}
  pkce:
    mode: required
    method: S256
  response_mapping:
    provider_account_id: null
    provider_user_id: null
    granted_scopes: $.scope
    credentials: []
    requirements:
    - auth_requirement_id: x_workspace
      provider_account_id: null
      provider_user_id: null
      granted_scopes: $.scope
      credentials:
      - auth_requirement_id: null
        credential_kind: access_token
        value: $.access_token
      - auth_requirement_id: null
        credential_kind: refresh_token
        value: $.refresh_token
  token_lifecycle:
    auth_requirement_id: x_workspace
    access_token_credential_kind: access_token
    refresh_token_credential_kind: refresh_token
    expires_in: $.expires_in
    refresh_before_seconds: 300
tools:
- name: x_get_posts
  description: Read up to 10 X posts by id, with optional author details.
  activity_label: Reading X posts
  auth:
  - x_workspace
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: x.get_posts
  allowed_agent_roles: []
  side_effect: external_read
  limits:
    max_response_bytes: 262144
    max_component_ms: 30000
  input_schema:
    type: object
    additionalProperties: false
    required:
    - ids
    properties:
      ids:
        type: array
        minItems: 1
        maxItems: 10
        uniqueItems: true
        items:
          type: string
          pattern: ^[0-9]{1,19}$
      include_authors:
        type: boolean
- name: x_search_recent_posts
  description: Search one page of recent X posts with explicit result and pagination limits.
  activity_label: Searching X posts
  auth:
  - x_workspace
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: x.search_recent_posts
  allowed_agent_roles: []
  side_effect: external_read
  limits:
    max_response_bytes: 262144
    max_component_ms: 30000
  input_schema:
    type: object
    additionalProperties: false
    required:
    - query
    - max_results
    properties:
      query:
        type: string
        minLength: 1
        maxLength: 512
      max_results:
        type: integer
        minimum: 10
        maximum: 25
      next_token:
        type: string
        minLength: 1
        maxLength: 1024
      include_authors:
        type: boolean
- name: x_create_post
  description: Publish one text post or reply on X after workspace authorization.
  activity_label: Publishing X post
  auth:
  - x_workspace
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: x.create_post
  allowed_agent_roles: []
  side_effect: external_write
  limits:
    max_response_bytes: 262144
    max_component_ms: 30000
  input_schema:
    type: object
    additionalProperties: false
    required:
    - text
    properties:
      text:
        type: string
        minLength: 1
        maxLength: 280
      reply_to_post_id:
        type: string
        pattern: ^[0-9]{1,19}$
      allow_link:
        type: boolean
pricing:
  tools:
  - tool: x_get_posts
    kind: metered
    units:
    - unit: post_read
      label: Post read
      price_usd_micros: 5000
      max_units_per_call: 10
    - unit: user_read
      label: User read
      price_usd_micros: 10000
      max_units_per_call: 10
  - tool: x_search_recent_posts
    kind: metered
    units:
    - unit: post_read
      label: Post read
      price_usd_micros: 5000
      max_units_per_call: 25
    - unit: user_read
      label: User read
      price_usd_micros: 10000
      max_units_per_call: 25
  - tool: x_create_post
    kind: usage_reported
    max_cost_usd_micros_per_call: 200000
ingress: []
events: []
limits:
  max_event_payload_bytes: null
  max_tool_response_bytes: 262144
  max_component_ms: 30000
