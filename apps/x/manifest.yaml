id: x
name: X
version: 2.0.1
icon:
  media_type: image/png
  data_base64: 
  color_pair:
    primary: "#000000"
    secondary: "#FFFFFF"
source:
  kind: built_in
  package: null
runtime:
  kind: wasm_component
  component_ref: component/x.wasm
  abi: firna-app-component-v1
env: {}
secrets:
- name: client_id
  required: true
- name: client_secret
  required: true
- name: bearer_token
  required: true
install:
  policy: explicit
  connection_mode: multiple
capabilities:
  http:
    allowed_hosts:
    - api.x.com
    allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    max_response_bytes: 262144
auth_requirements:
- id: x_workspace
  kind: oauth_install
  provider: x
  credential_flow: x_oauth
  owner: workspace
  scopes:
  - tweet.read
  - tweet.write
  - users.read
  - follows.read
  - follows.write
  - like.read
  - like.write
  - list.read
  - list.write
  - block.read
  - mute.read
  - mute.write
  - bookmark.read
  - bookmark.write
  - dm.read
  - dm.write
  - space.read
  - timeline.read
  - tweet.moderate.write
  - media.write
  - offline.access
  credential_kinds:
  - access_token
  - refresh_token
  required_for: []
credential_flows:
- kind: standard_oauth2
  id: x_oauth
  authorization_url: https://x.com/i/oauth2/authorize
  token_url: https://api.x.com/2/oauth2/token
  client:
    client_id: null
    client_id_env: client_id
    client_secret_env: client_secret
    auth_method: client_secret_basic
  scope:
    separator: ' '
    authorization_param: scope
    user_authorization_param: null
    token_param: null
  authorization_params: {}
  token_params: {}
  pkce:
    mode: required
    method: S256
  response_mapping:
    provider_account_id: null
    provider_user_id: null
    granted_scopes: $.scope
    credentials: []
    requirements:
    - auth_requirement_id: x_workspace
      provider_account_id: null
      provider_user_id: null
      granted_scopes: $.scope
      credentials:
      - auth_requirement_id: null
        credential_kind: access_token
        value: $.access_token
      - auth_requirement_id: null
        credential_kind: refresh_token
        value: $.refresh_token
  identity:
    url: https://api.x.com/2/users/me
    access_token_credential_kind: access_token
    response_mapping:
      provider_account_id: $.data.id
      provider_account_label: $.data.username
  token_lifecycle:
    auth_requirement_id: x_workspace
    access_token_credential_kind: access_token
    refresh_token_credential_kind: refresh_token
    expires_in: $.expires_in
    refresh_before_seconds: 300
tools:
- name: x_get_posts
  description: Read up to 10 X posts by id, with optional author details.
  activity_label: Reading X posts
  auth:
  - x_workspace
  input_schema_ref: null
  output_schema_ref: null
  export: call-tool
  operation: x.get_posts
  allowed_agent_roles: []
  side_effect: external_read
  limits:
    max_response_bytes: 262144
    max_component_ms: 30000
  input_schema:
    type: object
    additionalProperties: false
    required:
    - ids
    properties:
      ids:
        type: array
        minItems: 1
        maxItems: 10
        uniqueItems: true
        items:
          type: string
          pattern: ^[0-9]{1,19}$
      include_authors:
        type: boolean
- name: x_get_post_metrics
  description: Read current engagement metrics for up to 10 X posts.
  activity_label: Reading X post metrics
