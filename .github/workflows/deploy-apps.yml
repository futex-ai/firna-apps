name: Deploy Firna Apps

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types:
      - firna-platform-deployed
  workflow_dispatch:
    inputs:
      app:
        description: App id to deploy, or all
        required: false
        default: all
      instance:
        description: Environment instance to deploy, or all
        required: false
        default: all

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: firna-apps-deploy
  cancel-in-progress: false

env:
  FIRNA_PLATFORM_REPOSITORY: https://github.com/futex-ai/firna.git
  FIRNA_PLATFORM_REVISION: a59d30891868aaabbb8c675f70307fa192ee22f5
  RUST_TOOLCHAIN_VERSION: 1.89.0

jobs:
  prepare:
    name: Plan deployment matrix
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      forced: ${{ steps.selection.outputs.forced }}
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Select app packages
        id: selection
        shell: bash
        env:
          MANUAL_APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          manual_app="${MANUAL_APP:-}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$manual_app" != "all" ]; then
            if [ ! -f "apps/$manual_app/manifest.yaml" ] && [ ! -f "apps/$manual_app/manifest.json" ]; then
              echo "::error::app package apps/$manual_app does not exist"
              exit 1
            fi
            printf '%s\n' "$manual_app" > candidate-apps
          else
            find apps -mindepth 2 -maxdepth 2 \( -name manifest.yaml -o -name manifest.json \) -print \
              | awk -F/ '{ print $2 }' \
              | sort -u > candidate-apps
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "forced=true" >> "$GITHUB_OUTPUT"
          else
            echo "forced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build environment instance matrix
        id: matrix
        shell: bash
        env:
          MANUAL_INSTANCE: ${{ inputs.instance }}
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/deploy_matrix.py --instance "${MANUAL_INSTANCE:-all}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload candidate app list
        uses: actions/upload-artifact@v4
        with:
          name: candidate-apps-${{ github.run_id }}
          path: candidate-apps
          retention-days: 1

  deploy:
    name: Deploy to ${{ matrix.instance }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest-m
    timeout-minutes: 45
    environment: ${{ matrix.instance }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Download candidate app list
        uses: actions/download-artifact@v4
        with:
          name: candidate-apps-${{ github.run_id }}

      - name: Configure private Firna source access
        env:
          FIRNA_REPOSITORY_TOKEN: ${{ secrets.FIRNA_REPOSITORY_TOKEN }}
        run: bash scripts/configure-firna-repository-access.sh

      - name: Select instance app packages
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/select_instance_apps.py \
            --environment-class "${{ matrix.environment_class }}" \
            --candidates candidate-apps > instance-apps
          echo "Deploying to ${{ matrix.instance }}:"
          cat instance-apps

      - name: Install Firna CLI system dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libasound2-dev \
            libpq-dev \
            pkg-config \
            protobuf-compiler

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN_VERSION}"
          rustup default "${RUST_TOOLCHAIN_VERSION}"

      - name: Restore Firna CLI build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: firna-apps-cli-${{ env.FIRNA_PLATFORM_REVISION }}
          cache-targets: false

      - name: Install pinned Firna CLI
        run: |
          cargo install --locked \
            --git "${FIRNA_PLATFORM_REPOSITORY}" \
            --rev "${FIRNA_PLATFORM_REVISION}" \
            --root "${RUNNER_TEMP}/firna-cli" \
            --bin firna \
            fna-cli
          echo "${RUNNER_TEMP}/firna-cli/bin" >> "$GITHUB_PATH"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.APPS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.APPS_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Log in as Firna deployment admin
        shell: bash
        run: |
          set -euo pipefail
          escape_github_command() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            printf '%s' "$value"
          }
          password="$(gcloud secrets versions access latest \
            --project="${{ matrix.platform_project }}" \
            --secret="${{ matrix.bootstrap_password_secret }}")"
          echo "::add-mask::$(escape_github_command "$password")"
          firna config set-server "${{ matrix.api_url }}"
          FIRNA_APP_ADMIN_PASSWORD="$password" \
            firna admin login \
              --email "${{ matrix.admin_email }}" \
              --password-env FIRNA_APP_ADMIN_PASSWORD

      - name: Plan app package deployment
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.prepare.outputs.forced }}" = "true" ]; then
            cp instance-apps deploy-apps
          else
            firna admin apps catalog --json > remote-app-catalog.json
            : > changed-apps
            : > local-app-manifests.jsonl
            while IFS= read -r app; do
              [ -n "$app" ] || continue
              manifest_json="$(firna apps validate "apps/$app" --json)"
              python3 -c 'import json,sys; payload=json.load(sys.stdin); payload["directory"]=sys.argv[1]; print(json.dumps(payload, sort_keys=True))' "$app" \
                <<< "$manifest_json" >> local-app-manifests.jsonl
            done < instance-apps
            python3 scripts/plan-app-deploys.py \
              --catalog remote-app-catalog.json \
              --local-manifests local-app-manifests.jsonl \
              --changed-apps changed-apps > deploy-apps
          fi
          {
            echo "apps<<EOF"
            cat deploy-apps
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Submit through trusted admin auto-approval
        if: steps.plan.outputs.apps != ''
        shell: bash
        run: |
          set -euo pipefail
          escape_github_command() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            printf '%s' "$value"
          }
          while IFS= read -r app; do
            [ -n "$app" ] || continue
            app_dir="apps/$app"
            manifest_json="$(firna apps validate "$app_dir" --json)"
            manifest_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$manifest_json")"
            safe_app="${manifest_id//-/_}"
            mapfile -t secrets < <(python3 -c 'import json,sys; [print(secret) for secret in json.load(sys.stdin)["required_secrets"]]' <<< "$manifest_json")
            submit_args=()
            for secret_name in "${secrets[@]}"; do
              secret_id="${{ matrix.secret_prefix }}-${manifest_id}-${secret_name//_/-}"
              echo "Reading Secret Manager app secret projects/${{ matrix.apps_project }}/secrets/${secret_id}"
              value="$(gcloud secrets versions access latest \
                --project="${{ matrix.apps_project }}" \
                --secret="$secret_id")"
              if [ -z "$value" ]; then
                echo "::error::missing required app secret $secret_id"
                exit 1
              fi
              echo "::add-mask::$(escape_github_command "$value")"
              env_name="FIRNA_APP_SECRET_${safe_app}_${secret_name}"
              export "$env_name=$value"
              submit_args+=(--secret-env "${secret_name}=${env_name}")
            done
            firna admin apps submit "$app_dir" "${submit_args[@]}"
          done <<< "${{ steps.plan.outputs.apps }}"
