name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firna-apps-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ACTIONLINT_VERSION: v1.7.12
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  RUST_TOOLCHAIN_VERSION: 1.89.0
  WASM_TOOLS_VERSION: 1.248.0

jobs:
  verify:
    name: Verify app packages
    runs-on: ubuntu-latest-m
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure private Firna source access
        env:
          FIRNA_REPOSITORY_TOKEN: ${{ secrets.FIRNA_REPOSITORY_TOKEN }}
        run: bash scripts/configure-firna-repository-access.sh

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN_VERSION}" --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN_VERSION}"
          rustup target add wasm32-unknown-unknown

      - name: Install actionlint
        run: |
          asset="actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          install_root="${RUNNER_TEMP}/actionlint"
          curl --fail --silent --show-error --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 120 \
            --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${asset}" \
            --output "${RUNNER_TEMP}/${asset}"
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum --check
          mkdir -p "${install_root}"
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${install_root}" actionlint
          echo "${install_root}" >> "$GITHUB_PATH"

      - name: Install wasm-tools
        uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154 # v2.81.8
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }}
          fallback: none

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: firna-apps-linux-${{ env.RUST_TOOLCHAIN_VERSION }}
          cache-targets: true

      - name: Run repository checks
        run: cargo xtask check
